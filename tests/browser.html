<!doctype html><meta charset="utf-8"><title>ClassCast local regression</title><button id="run">執行編輯與儲存驗證</button><button id="speech">測試真實語音辨識</button><button id="chinese">測試中文字幕完整流程</button><pre id="result">等待測試</pre><iframe id="app" src="/" style="width:100%;height:1000px"></iframe><script>
const results=document.getElementById('result'),frame=document.getElementById('app');const pause=t=>new Promise(r=>setTimeout(r,t));const assert=(x,s)=>{if(!x)throw Error(s);results.textContent+='\nPASS '+s};
async function decodedCanvas(blob,time){const M=await import('/vendor/mediabunny-1.61.3.mjs');const input=new M.Input({source:new M.BlobSource(blob),formats:M.ALL_FORMATS});try{const track=await input.getPrimaryVideoTrack(),sink=new M.CanvasSink(track,{width:640,height:360,fit:'contain',poolSize:1});const sample=await sink.getCanvas(time);if(!sample)throw Error('No decoded output frame at '+time);const c=document.createElement('canvas');c.width=640;c.height=360;c.getContext('2d').drawImage(sample.canvas,0,0);return c}finally{input.dispose()}}
async function fixture(){const c=document.createElement('canvas');c.width=640;c.height=360;const ctx=c.getContext('2d'),audio=new AudioContext(),osc=audio.createOscillator(),dest=audio.createMediaStreamDestination();osc.connect(dest);osc.start();const stream=c.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let n=0;const timer=setInterval(()=>{ctx.fillStyle='#2455e8';ctx.fillRect(0,0,640,360);ctx.fillStyle='white';ctx.font='36px sans-serif';ctx.fillText('CLASSCAST '+n++,50,150)},33);const chunks=[],r=new MediaRecorder(stream,{mimeType:'video/webm'});r.ondataavailable=e=>chunks.push(e.data);const done=new Promise(resolve=>r.onstop=resolve);r.start();await pause(3200);r.stop();await done;clearInterval(timer);stream.getTracks().forEach(t=>t.stop());osc.stop();audio.close();return new Blob(chunks,{type:'video/webm'})}
document.getElementById('run').onclick=async()=>{results.textContent='RUNNING';try{const w=frame.contentWindow,d=w.document;await w.loadVideo(await fixture(),'回歸測試影片.webm',3.2);assert(d.getElementById('stateLabel').textContent==='可開始編輯','synthetic video loaded');d.getElementById('trimStart').value='.2';d.getElementById('trimEnd').value='2.6';d.getElementById('addClip').click();d.getElementById('video').currentTime=1.3;await pause(250);d.getElementById('splitClip').click();assert(d.getElementById('clipList').children.length===2,'split into two clips');w.addSubtitle(.3,2,'字幕恢復測試');d.getElementById('subSize').value=48;d.getElementById('subColor').value='#ffcc00';d.getElementById('volume').value=70;d.getElementById('fadeIn').value=.5;d.getElementById('cursorShape').value='cross';d.getElementById('drawTool').value='ellipse';const c=d.getElementById('canvas'),b=c.getBoundingClientRect();c.dispatchEvent(new PointerEvent('pointerdown',{clientX:b.left+50,clientY:b.top+50,pointerId:1,bubbles:true}));c.dispatchEvent(new PointerEvent('pointermove',{clientX:b.left+150,clientY:b.top+100,pointerId:1,bubbles:true}));c.dispatchEvent(new PointerEvent('pointerup',{pointerId:1,bubbles:true}));await w.saveProject(false);const state=w.snapshot(),id=w.localStorage.getItem('classcast-last-project');assert(state.clips.length===2&&state.subs[0].text==='字幕恢復測試','project snapshot contains timeline and captions');assert(state.settings.cursorShape==='cross'&&state.settings.volume==='70','cursor and audio settings captured');const stored=await w.dbRead('projects',id);assert(stored.state.settings.subSize==='48','IndexedDB stores settings');assert(state.marks.length>0,'drawing annotations included in project');const backup=w.packProject(state,await fixture());assert((await backup.slice(0,8).text())==='CCAST02\n','portable backup has validated header');await w.restoreProject(id);assert(w.snapshot().subs.length===1&&w.snapshot().settings.subSize==='48','restored video and subtitle style');w.tab('export');await d.getElementById('exportBtn').onclick();const link=d.getElementById('downloadLink');assert(!link.hidden,'export link ready');const exported=await fetch(link.href).then(r=>r.blob());assert(exported.size>1000,'export file is nonempty');const v=document.createElement('video');v.src=URL.createObjectURL(exported);await new Promise((resolve,reject)=>{v.onloadedmetadata=resolve;v.onerror=reject});assert(v.videoWidth===640&&v.duration>2&&v.duration<3,'edited MP4 decodes to expected duration');const image=await decodedCanvas(exported,1.5);const painter=image.getContext('2d');const pixels=painter.getImageData(0,0,640,360).data;let yellow=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i]>170&&pixels[i+1]>130&&pixels[i+2]<110)yellow++;document.body.prepend(image);assert(yellow>100,'subtitle colour and drawing burned into output: '+yellow);const audioCheck=new AudioContext();const sound=await audioCheck.decodeAudioData(await exported.arrayBuffer());const samples=sound.getChannelData(0),rms=(start,end)=>{let sum=0,count=0;for(let i=Math.floor(start*sound.sampleRate);i<Math.min(samples.length,end*sound.sampleRate);i++){sum+=samples[i]*samples[i];count++}return Math.sqrt(sum/count)};assert(rms(.02,.08)<rms(.8,1)*.6,'audio fade-in encoded into output');await audioCheck.close();results.textContent+='\nALL EDITOR CHECKS PASSED';}catch(e){results.textContent+='\nFAIL '+e.stack}};
document.getElementById('speech').onclick=async()=>{results.textContent='ASR RUNNING';try{const a=new AudioContext({sampleRate:16000});const buffer=await fetch('https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/jfk.wav').then(r=>r.arrayBuffer());const decoded=await a.decodeAudioData(buffer),samples=decoded.getChannelData(0).slice(0,16000*6);a.close();const worker=new Worker('/asr-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='result'){assert(data.segments.length>0,'real Whisper model produced timestamps');assert(data.segments.some(s=>s.text.toLowerCase().includes('fellow')),'recognised reference speech');results.textContent+='\nASR CHECK PASSED';worker.terminate()}else if(data.type==='error'){results.textContent+='\nFAIL '+data.message;worker.terminate()}else results.textContent='ASR RUNNING\n'+(data.text||data.file+' '+Math.round(data.progress)+'%')};worker.onerror=e=>results.textContent+='\nFAIL '+e.message;worker.postMessage({type:'transcribe',audio:samples.buffer,model:'Xenova/whisper-tiny',language:'english'},[samples.buffer])}catch(e){results.textContent+='\nFAIL '+e.message}};
document.getElementById('chinese').onclick=async()=>{results.textContent='CHINESE PIPELINE RUNNING';try{const w=frame.contentWindow,d=w.document;if(d.getElementById('projects').open)d.getElementById('projects').close();const a=new AudioContext(),raw=await fetch('/local-speech.wav').then(r=>r.arrayBuffer()),buffer=await a.decodeAudioData(raw);const source=a.createBufferSource();source.buffer=buffer;const dest=a.createMediaStreamDestination();source.connect(dest);const c=document.createElement('canvas');c.width=640;c.height=360;const ctx=c.getContext('2d');ctx.fillStyle='#2455e8';ctx.fillRect(0,0,640,360);ctx.fillStyle='white';ctx.font='32px sans-serif';ctx.fillText('中文教學測試',60,160);const stream=c.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const chunks=[],rec=new MediaRecorder(stream,{mimeType:'video/webm'});rec.ondataavailable=e=>chunks.push(e.data);const stop=new Promise(resolve=>rec.onstop=resolve);rec.start();source.start();await new Promise(resolve=>source.onended=resolve);rec.stop();await stop;stream.getTracks().forEach(t=>t.stop());await a.close();await w.loadVideo(new Blob(chunks,{type:'video/webm'}),'中文辨識測試.webm',buffer.duration);w.tab('subtitles');d.getElementById('asrLanguage').value='chinese';d.getElementById('autoSub').click();const deadline=Date.now()+240000;while(d.getElementById('asrReview').hidden&&Date.now()<deadline){await pause(500);results.textContent='CHINESE PIPELINE RUNNING\n'+d.getElementById('asrStatus').textContent;if(!d.getElementById('autoSub').disabled)break}assert(!d.getElementById('asrReview').hidden,'Chinese review appears');const text=d.getElementById('asrPreview').querySelector('textarea')?.value||'';assert(text.length>2,'Chinese transcript produced: '+text);d.getElementById('applyAsr').click();assert(w.snapshot().subs.length>0,'transcript applied to editable subtitles');await w.saveProject(false);results.textContent+='\nCHINESE PIPELINE PASSED'}catch(e){results.textContent+='\nFAIL '+e.stack}};
</script>
