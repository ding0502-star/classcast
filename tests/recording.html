<!doctype html><meta charset="utf-8"><title>Background capture regression</title><button id="run">測試原生錄影與背景子母畫面</button><pre id="result">待測試</pre><canvas id="frozenPreview" width="640" height="360"></canvas><script src="recording.js"></script><script>
const report=document.getElementById('result'),pause=ms=>new Promise(r=>setTimeout(r,ms));
function check(ok,message){if(!ok)throw Error(message);report.textContent+='\nPASS '+message}
function source(camera){const c=document.createElement('canvas');c.width=640;c.height=360;const ctx=c.getContext('2d');const stream=c.captureStream(20),start=performance.now();const timer=setInterval(()=>{ctx.fillStyle=camera?'#ffff00':performance.now()-start<700?'#ff0000':'#0000ff';ctx.fillRect(0,0,640,360)},50);return{stream,close(){clearInterval(timer);stream.getTracks().forEach(t=>t.stop())}}}
async function capture(stream){const chunks=[],r=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8'});r.ondataavailable=e=>chunks.push(e.data);const stopped=new Promise((resolve,reject)=>{r.onstop=resolve;r.onerror=reject});r.start();await pause(1800);r.stop();await stopped;return new Blob(chunks,{type:r.mimeType})}
async function pixels(blob,t){const v=document.createElement('video');v.src=URL.createObjectURL(blob);await new Promise((resolve,reject)=>{v.onloadedmetadata=resolve;v.onerror=reject});await new Promise(resolve=>{v.onseeked=resolve;v.currentTime=t});const c=document.createElement('canvas');c.width=640;c.height=360;const ctx=c.getContext('2d');ctx.drawImage(v,0,0,640,360);const sample=(x,y)=>Array.from(ctx.getImageData(x,y,1,1).data);const out={screen:sample(50,50),camera:sample(550,300)};URL.revokeObjectURL(v.src);return out}
document.getElementById('run').onclick=async()=>{report.textContent='RUNNING (preview remains frozen throughout)';let s,c,p;try{const still=document.getElementById('frozenPreview').getContext('2d');still.fillStyle='black';still.fillRect(0,0,640,360);s=source(false);p=await ClassCastRecording.createStream(s.stream);check(p.stream.getVideoTracks()[0]===s.stream.getVideoTracks()[0],'screen recording uses original capture track');let blob=await capture(p.stream),early=await pixels(blob,.25),late=await pixels(blob,1.2);check(early.screen[0]>200&&late.screen[2]>200,'screen frames change while preview is frozen');p.close();s.close();s=source(false);c=source(true);p=await ClassCastRecording.createStream(s.stream,c.stream,{height:360,onError:e=>{report.textContent+='\nWORKER ERROR '+e.message}});blob=await capture(p.stream);early=await pixels(blob,.25);late=await pixels(blob,1.2);check(early.screen[0]>200&&late.screen[2]>200,'worker screen frames change without animation callbacks');check(late.camera[0]>200&&late.camera[1]>200&&late.camera[2]<50,'worker camera inset is preserved');check(still.getImageData(50,50,1,1).data[2]===0,'preview was never refreshed');report.textContent+='\nALL RECORDING CHECKS PASSED'}catch(e){report.textContent+='\nFAIL '+e.stack}finally{p?.close();s?.close();c?.close()}};
</script>
<button id="integration">測試錄影開始、暫停、結束與專案載入</button><iframe id="app" src="/" style="width:100%;height:700px"></iframe><script>
document.getElementById('integration').onclick=async()=>{report.textContent='APP INTEGRATION RUNNING';const w=document.getElementById('app').contentWindow,d=w.document,media=w.navigator.mediaDevices;const oldDisplay=media.getDisplayMedia,oldUser=media.getUserMedia;let screen,camera;try{if(d.getElementById('projects').open)d.getElementById('projects').close();screen=source(false);camera=source(true);media.getDisplayMedia=async()=>screen.stream;media.getUserMedia=async()=>camera.stream;d.getElementById('mic').checked=false;d.querySelector('[data-mode="both"]').click();const starting=d.getElementById('recordBtn').onclick();while(!d.getElementById('preflight').open)await pause(50);d.getElementById('captureCountdown').value='0';d.getElementById('confirmCapture').click();await starting;check(!d.getElementById('recordControls').hidden,'app started recording');await pause(500);d.getElementById('pauseRecord').click();check(d.getElementById('pauseRecord').textContent==='繼續','pause works');await pause(100);d.getElementById('pauseRecord').click();await pause(1600);const journals=await w.ClassCastRecovery.list();check(journals.some(r=>r.count>0&&!r.complete),'recording chunks persist before stop');d.getElementById('stopRecord').click();const deadline=Date.now()+10000;while((d.getElementById('playBtn').disabled||d.getElementById('stateLabel').textContent!=='可開始編輯')&&Date.now()<deadline)await pause(100);check(!d.getElementById('playBtn').disabled,'recording loaded into editor');check(w.snapshot().duration>1,'recorded project duration is valid');await w.saveProject(false);check(d.getElementById('saveStatus').textContent.includes('已儲存'),'recorded project autosave works');report.textContent+='\nAPP INTEGRATION PASSED'}catch(e){report.textContent+='\nFAIL '+e.stack}finally{media.getDisplayMedia=oldDisplay;media.getUserMedia=oldUser;screen?.close();camera?.close()}};
</script>
